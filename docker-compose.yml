services:
  wep-app:
    build:
      context: .
    ports:
      - "8000:8000"
      
    volumes:
      - ./services:/services
    environment:
      - DB_HOST=database
      - DB_NAME=dbname
      - DB_USER=dbuser
      - DB_PASS=pass

    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    working_dir: /services
    depends_on:
      - database
      - redis

  database:
    image: postgres:14.6-alpine
    environment:
      - POSTGRES_DB=dbname
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=pass
  redis:
    image: redis:7.0.5-alpine

  worker:
    build:
      context: .
    hostname: worker
    entrypoint: celery
    command: -A celery_app.app worker --loglevel=info
    working_dir: /services
    volumes:
      - ./services:/services
    links:
      - redis
    depends_on:
      - redis
      - database
    environment:
      - DB_HOST=database
      - DB_NAME=dbname
      - DB_USER=dbuser
      - DB_PASS=pass

  flower:
    build:
      context: .
    hostname: flower
    entrypoint: celery
    command: -A celery_app.app flower
    working_dir: /services
    volumes:
      - ./services:/services
    links:
      - redis
    depends_on:
      - redis
    ports:
      - '5555:5555'


    
      